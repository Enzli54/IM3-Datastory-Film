<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Filme nach Genre und Jahrzehnt</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>

    <style>
        /* Genre-Buttons für den Verlauf-Chart */
        .genre-button {
            border: 2px solid var(--genre-farbe);
            background: transparent;
            color: #888;
            border-radius: 999px;
            padding: 4px 12px;
            margin: 3px;
            cursor: pointer;
            opacity: 0.5;
        }

        .genre-button.aktiv {
            background: var(--genre-farbe);
            color: #fff;
            opacity: 1;
        }
    </style>
</head>

<body>

<header>
    <h1>Die Website ist in Arbeit</h1>
    <p>Hello World</p>
</header>

<!-- Chart 1: Filme nach Genre pro Jahrzehnt -->
<section>

    <div id="jahrzehnte">
        <button data-decade="1970">1970er</button>
        <button data-decade="1980">1980er</button>
        <button data-decade="1990">1990er</button>
        <button data-decade="2000">2000er</button>
        <button data-decade="2010">2010er</button>
        <button data-decade="2020">2020er</button>
    </div>

    <canvas id="verlauf"></canvas>

</section>

<!-- Chart 2: Filme pro Jahr, eine Linie pro Genre -->
<section>

    <div>
        <button id="alleAn">Alle an</button>
        <button id="alleAus">Alle aus</button>
    </div>

    <!-- Die Genre-Buttons werden vom Script hier eingefügt -->
    <div id="genreButtons"></div>

    <canvas id="genreVerlauf"></canvas>

</section>

<script src="script.js" type="module"></script>

</body>
</html>
